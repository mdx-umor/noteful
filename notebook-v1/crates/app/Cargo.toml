[package]
name = "notebook_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "notebook"
path = "src/main.rs"

[dependencies]
notebook_core = { path = "../core" }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
png = { version = "0.18", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }

[features]
# Desktop-only test mode: OpenGL renderer, scripted Pencil input and screenshots.
autotest = ["eframe/glow", "dep:png"]
