<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notebook">
<meta name="theme-color" content="#1e1e20">
<title>Notebook</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1e1e20; }
  body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #notebook-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             color: #f2f2f4; font: 17px -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; }
  #loading .badge { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #6a3cf0, #0a84ff);
                    display: grid; place-items: center; font-size: 34px; font-weight: 600; color: #fff; }
  #loading small { color: #8e8e93; }
</style>
</head>
<body>
<canvas id="notebook-canvas"></canvas>
<div id="loading"><div class="badge">N</div><div>Loading Notebook…</div><small>Works best in Safari on iPad with Apple Pencil.</small></div>
<script>
/*GLUE*/
</script>
<script>
(async () => {
  const fail = (msg) => { document.getElementById("loading").innerHTML = "<div>Notebook could not start.</div><small>" + msg + "</small>"; };
  try {
    if (!("DecompressionStream" in window)) return fail("Please update Safari (iPadOS 16.4 or newer).");
    const raw = Uint8Array.from(atob("WASM_B64"), (c) => c.charCodeAt(0));
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"));
    const bytes = await new Response(stream).arrayBuffer();
    await wasm_bindgen({ module_or_path: bytes });
  } catch (e) {
    console.error(e);
    fail(String(e));
  }
})();
</script>
</body>
</html>
