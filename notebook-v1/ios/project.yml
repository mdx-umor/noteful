# Xcode project for Notebook v1 on iPad.
# Generate it on a Mac with:  brew install xcodegen && cd ios && xcodegen
name: Notebook
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # Pick your team in Xcode (Signing & Capabilities) or set it here.
    DEVELOPMENT_TEAM: ""
targets:
  Notebook:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Notebook
    info:
      path: Notebook/Info.plist
      properties:
        CFBundleDisplayName: Notebook
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Exports and backups appear in Files › On My iPad › Notebook.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Pointer support for trackpads and mice.
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.notebook
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        # The C stub is replaced by the Rust executable; keep Xcode from stripping it.
        STRIP_INSTALLED_PRODUCT: NO
        DEAD_CODE_STRIPPING: NO
    postBuildScripts:
      - name: Build Rust app
        script: "\"${SRCROOT}/build-rust.sh\""
        basedOnDependencyAnalysis: false
