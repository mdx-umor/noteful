# Builds Notebook v1 for iPad on a GitHub Mac and uploads an unsigned .ipa.
# Sign and install it with your own Apple ID (Sideloadly, AltStore or Xcode).
name: iPad build

on:
  push:
    paths:
      - "notebook-v1/**"
      - ".github/workflows/ipad-build.yml"
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust for iPad
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            notebook-v1/target
          key: ios-${{ hashFiles('notebook-v1/Cargo.lock') }}

      - name: Core tests
        working-directory: notebook-v1
        run: cargo test -p notebook_core --locked

      - name: Generate Xcode project
        working-directory: notebook-v1/ios
        run: |
          brew install xcodegen
          xcodegen

      - name: Build app (unsigned)
        working-directory: notebook-v1/ios
        run: |
          xcodebuild -project Notebook.xcodeproj -target Notebook -configuration Release \
            -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
          test -f build/Release-iphoneos/Notebook.app/Notebook

      - name: Package .ipa
        working-directory: notebook-v1/ios
        run: |
          APP=build/Release-iphoneos/Notebook.app
          file "$APP/Notebook"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Notebook-v1-unsigned.ipa Payload
          ls -la Notebook-v1-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Notebook-v1-unsigned-ipa
          path: notebook-v1/ios/Notebook-v1-unsigned.ipa
          retention-days: 30

  simulator:
    # Launches the app in an iPad simulator and collects a screenshot, console
    # output and any crash report, to catch start-up problems without a device.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust for iPad simulator
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            notebook-v1/target
          key: iossim-${{ hashFiles('notebook-v1/Cargo.lock') }}

      - name: Build for simulator
        working-directory: notebook-v1/ios
        run: |
          brew install xcodegen
          xcodegen
          set -o pipefail
          xcodebuild -project Notebook.xcodeproj -target Notebook -configuration Release \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build | tail -30
          codesign --force --sign - --deep build/Release-iphonesimulator/Notebook.app

      - name: Run in iPad simulator
        working-directory: notebook-v1/ios
        run: |
          mkdir -p sim
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPad (Pro|Air)" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Device: $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Release-iphonesimulator/Notebook.app
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" build/Release-iphonesimulator/Notebook.app/Info.plist)
          (xcrun simctl launch --console "$DEV" "$BID" > sim/console.txt 2>&1 &)
          sleep 25
          xcrun simctl io "$DEV" screenshot sim/screenshot.png || true
          if xcrun simctl spawn "$DEV" launchctl list | grep -q "$BID"; then echo "RUNNING" | tee sim/status.txt; else echo "NOT RUNNING" | tee sim/status.txt; fi
          xcrun simctl spawn "$DEV" log show --last 3m --style compact --predicate 'process == "Notebook" OR eventMessage CONTAINS "Notebook"' > sim/log.txt 2>&1 || true
          DATA=$(xcrun simctl get_app_container "$DEV" "$BID" data 2>/dev/null || true)
          echo "App data: $DATA"
          ls -la "$DATA/Documents" || true
          cp "$DATA"/Documents/Notebook-*.txt sim/ 2>/dev/null || true
          echo "===== Notebook-log.txt ====="; cat sim/Notebook-log.txt 2>/dev/null || true
          echo "===== console ====="; cat sim/console.txt || true
          cp ~/Library/Logs/DiagnosticReports/*otebook* sim/ 2>/dev/null || true
          tail -50 sim/console.txt || true
          cat sim/Notebook-crash-log.txt 2>/dev/null | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-run
          path: notebook-v1/ios/sim
